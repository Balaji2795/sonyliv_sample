apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonyliv
  labels:
    app: sonyliv
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sonyliv
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: sonyliv
    spec:
      containers:
      - name: sonyliv
        image: your-dockerhub-username/sonyliv:latest
        ports:
        - containerPort: 8080

        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"

        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10

        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 5
